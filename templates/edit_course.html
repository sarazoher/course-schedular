{% extends "base.html" %}

{% block content %}
  <div class="form-page">
    <div class="form-card">
      <h2 class="form-title">Edit Course — {{ course.code }}</h2>

      <form method="POST">
        <div class="mb-3">
          <label for="code" class="form-label">Course Code</label>
          <input type="text"
                 id="code"
                 name="code"
                 value="{{ course.code }}"
                 class="form-control"
                 required>
        </div>

        <div class="mb-3">
          <label for="name" class="form-label">Course Name</label>
          <input type="text"
                 id="name"
                 name="name"
                 value="{{ course.name }}"
                 class="form-control"
                 required>
        </div>

        <div class="mb-3">
          <label for="credits" class="form-label">Credits</label>
          <input type="number"
                 id="credits"
                 name="credits"
                 min="0"
                 value="{{ course.credits }}"
                 class="form-control"
                 required>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save changes</button>
          <a href="{{ url_for('main.view_plan', plan_id=plan.id) }}" class="btn btn-outline-secondary">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
