{% extends "base.html" %}

{% block content %}
  <div class="form-page">
    <div class="form-card">

      <h2 class="form-title">Create a New Degree Plan</h2>

      <form method="POST">
        <div class="mb-4">
          <label class="form-label">Plan name</label>
          <input
            class="form-control"
            type="text"
            name="name"
            placeholder="e.g. CS BSc"
            required
          >
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">
            Create plan
          </button>
          <a class="btn btn-outline-secondary"
             href="{{ url_for('main.dashboard') }}">
            Cancel
          </a>
        </div>

      </form>
    </div>
  </div>
{% endblock %}
