{% extends "base.html" %}

{% block content %}
  <div class="text-center home-landing">
    <h1 class="mb-2">Course Scheduler</h1>
    <p class="text-muted mb-4">
      Login or register to create degree plans and generate schedules.
    </p>

    <div class="centered-actions">
      <a class="btn btn-primary btn-tall" href="{{ url_for('auth.login') }}">
        Login
      </a>
      <a class="btn btn-outline-secondary btn-tall"
         href="{{ url_for('auth.register') }}">
        Register
      </a>
    </div>
  </div>
{% endblock %}
